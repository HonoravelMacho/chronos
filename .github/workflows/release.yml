name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  APP_NAME: chronos
  BUILD_TYPE: Release

jobs:
  # ── Linux: .deb + .rpm + .tar.gz ──────────────────────────────────────────
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libcurl4-openssl-dev \
            libsqlite3-dev libgl1-mesa-dev libx11-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxi-dev libasound2-dev \
            rpm fakeroot

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=$BUILD_TYPE

      - name: Build
        run: cmake --build build --parallel

      - name: Smoke
        run: ./build/chronos --smoke

      - name: Package (CPack → DEB/RPM/TGZ)
        working-directory: build
        run: cpack -G "DEB;RPM;TGZ"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chronos-linux
          path: |
            build/*.deb
            build/*.rpm
            build/*.tar.gz

  # ── Windows: .exe estático + .zip ──────────────────────────────────────────
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install deps (vcpkg)
        run: |
          vcpkg install curl:x64-windows-static sqlite3:x64-windows-static
          echo "CMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" >> $env:GITHUB_ENV

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DVCPKG_TARGET_TRIPLET=x64-windows-static

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Smoke
        run: .\build\Release\chronos.exe --smoke

      - name: Zip
        run: |
          Compress-Archive -Path .\build\Release\chronos.exe -DestinationPath chronos-windows-x86_64.zip

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chronos-windows
          path: |
            chronos-windows-x86_64.zip
            build/Release/chronos.exe

  # ── Android: .apk universal (ARM64+ARMv7) via Gradle+NDK ───────────────────
  android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # NOTA: android-actions/setup-android@v3 está quebrado (sdkmanager "tools"
      # removido). O runner já traz o SDK em $ANDROID_SDK_ROOT — instalamos só
      # os pacotes que faltam, aceitando as licenças de forma não-interativa.
      - name: Install Android packages
        run: |
          echo "SDK=$ANDROID_SDK_ROOT"
          # Sem setup-android@v3, o cmdline-tools não entra no PATH sozinho.
          CMDTOOLS=$(ls -d "$ANDROID_SDK_ROOT"/cmdline-tools/* | sort -V | tail -1)
          export PATH="$CMDTOOLS/bin:$PATH"
          echo "$CMDTOOLS/bin" >> $GITHUB_PATH
          yes | sdkmanager --licenses > /dev/null
          sdkmanager --install "platform-tools" "platforms;android-34" \
            "build-tools;34.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # APK debug = assinado com chave de debug, instalável direto, universal
      # (arm64-v8a + armeabi-v7a). Para APK release assinado, adicione secrets
      # ANDROID_KEYSTORE_* + bloco signingConfigs (ver README).
      - name: Build universal APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             chronos-android-universal.apk
          ls -la chronos-android-universal.apk

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chronos-android
          path: |
            chronos-android-universal.apk
            android/app/build/outputs/apk/**/*.apk

  # ── Publica tudo na Release do GitHub ──────────────────────────────────────
  publish:
    needs: [linux, windows, android]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
