name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  APP_NAME: chronos
  BUILD_TYPE: Release

jobs:
  # ── Linux: .deb + .rpm + .tar.gz ──────────────────────────────────────────
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libcurl4-openssl-dev \
            libsqlite3-dev libgl1-mesa-dev libx11-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxi-dev libasound2-dev \
            rpm fakeroot

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=$BUILD_TYPE

      - name: Build
        run: cmake --build build --parallel

      - name: Smoke
        run: ./build/chronos --smoke

      - name: Package (CPack → DEB/RPM/TGZ)
        working-directory: build
        run: cpack -G "DEB;RPM;TGZ"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chronos-linux
          path: |
            build/*.deb
            build/*.rpm
            build/*.tar.gz

  # ── Windows: .exe estático + .zip ──────────────────────────────────────────
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install deps (vcpkg)
        run: |
          vcpkg install curl:x64-windows-static sqlite3:x64-windows-static
          echo "CMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" >> $env:GITHUB_ENV

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DVCPKG_TARGET_TRIPLET=x64-windows-static

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Smoke
        run: .\build\Release\chronos.exe --smoke

      - name: Zip
        run: |
          Compress-Archive -Path .\build\Release\chronos.exe -DestinationPath chronos-windows-x86_64.zip

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chronos-windows
          path: |
            chronos-windows-x86_64.zip
            build/Release/chronos.exe

  # ── Android: .apk universal (ARM64) via NDK ────────────────────────────────
  android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK/NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK + CMake
        run: |
          sdkmanager --install "ndk;25.2.9519653" "cmake;3.22.1" "platforms;android-33" "build-tools;33.0.2"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Configure (ARM64)
        run: |
          cmake -S . -B build-android -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DCHRONOS_ENABLE_CURL=OFF

      - name: Build
        run: cmake --build build-android --parallel

      # Empacota o binário em APK debug/universal de alta compatibilidade.
      # Para APK assinado de release, adicione secrets ANDROID_KEYSTORE_*.
      - name: Build APK wrapper (gradle)
        run: |
          if [ -f android/build.gradle ]; then
            cd android && ./gradlew assembleRelease
          else
            echo "Sem wrapper android/ — gerando APK mínimo via sdkmanager/APK shell (placeholder)."
            mkdir -p apk-out
            cp build-android/chronos apk-out/libchronos.so || true
          fi

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chronos-android
          path: |
            android/app/build/outputs/apk/**/*.apk
            apk-out/**

  # ── Publica tudo na Release do GitHub ──────────────────────────────────────
  publish:
    needs: [linux, windows, android]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
