name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  APP_NAME: chronos_hub
  FLUTTER_VERSION: "3.44.9"

jobs:
  # ── Flutter: análise + testes (porta de entrada) ──────────────────────────
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  # ── Android: .apk universal ───────────────────────────────────────────────
  android:
    needs: check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Pub get
        run: flutter pub get
      - name: Build universal APK
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          flutter build apk --release \
            --build-name="$TAG" --build-number="${GITHUB_RUN_NUMBER}"
          cp build/app/outputs/flutter-apk/app-release.apk \
             chronos-android-universal.apk
          ls -la chronos-android-universal.apk
      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chronos-android
          path: chronos-android-universal.apk

  # ── Linux: bundle Flutter → .tar.gz + .deb + .rpm ─────────────────────────
  linux:
    needs: check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev rpm fakeroot dpkg-dev
      - name: Pub get
        run: flutter pub get
      - name: Build Linux bundle
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          flutter build linux --release \
            --build-name="$TAG" --build-number="${GITHUB_RUN_NUMBER}"
          ls -la build/linux/x64/release/bundle/
      - name: Build daemon CLI (entrega com app fechado)
        run: |
          dart compile exe tool/chronos_daemon.dart -o build/chronos_daemon
          ./build/chronos_daemon --help
      - name: Package (.tar.gz + .deb + .rpm)
        run: |
          set -eux
          TAG="${GITHUB_REF_NAME#v}"
          BUNDLE="build/linux/x64/release/bundle"
          # Stage FORA de dist/: dist/ contém SOMENTE os pacotes finais.
          STAGE="build/pkg-stage"
          rm -rf dist "$STAGE"
          mkdir -p "$STAGE/opt/chronos" dist
          cp -r "$BUNDLE/." "$STAGE/opt/chronos/"
          # Daemon CLI headless (usa o libsqlite3.so do próprio bundle).
          cp build/chronos_daemon "$STAGE/opt/chronos/"
          chmod +x "$STAGE/opt/chronos/chronos_daemon"
          # .tar.gz — bundle cru + README/LICENSE
          cp LICENSE README.md "$STAGE/opt/chronos/" || true
          tar -czf "dist/chronos-${TAG}-linux-x86_64.tar.gz" -C "$STAGE" opt
          # .desktop + ícone no stage (deb/rpm/tar)
          mkdir -p "$STAGE/usr/share/applications" \
                   "$STAGE/usr/share/icons/hicolor/scalable/apps" \
                   "$STAGE/usr/share/icons/hicolor/128x128/apps" \
                   "$STAGE/usr/share/icons/hicolor/512x512/apps"
          sed 's|^Exec=.*|Exec=/opt/chronos/chronos_hub|' chronos.desktop \
            > "$STAGE/usr/share/applications/chronos.desktop"
          cp assets/icons/chronos.svg \
             "$STAGE/usr/share/icons/hicolor/scalable/apps/chronos.svg"
          cp assets/icons/chronos-128.png \
             "$STAGE/usr/share/icons/hicolor/128x128/apps/chronos.png"
          cp assets/icons/chronos-512.png \
             "$STAGE/usr/share/icons/hicolor/512x512/apps/chronos.png"
          # .deb via dpkg-deb
          mkdir -p "$STAGE/DEBIAN"
          SIZE=$(du -sk "$STAGE" | cut -f1)
          cat > "$STAGE/DEBIAN/control" <<EOF
          Package: chronos
          Version: ${TAG}
          Section: net
          Priority: optional
          Architecture: amd64
          Maintainer: CHRONOS Contributors <https://github.com/HonoravelMacho/chronos>
          Installed-Size: ${SIZE}
          Description: Cross-platform Hub for Routed Outgoing Network Open Source
           CHRONOS — central tática de mensagens e agendamentos (Flutter HUD),
           100% auto-hospedada no dispositivo (Telegram + WhatsApp/Evolution).
          EOF
          fakeroot dpkg-deb --build "$STAGE" "dist/chronos-${TAG}-linux-x86_64.deb"
          # .rpm via rpmbuild (spec mínima, payload = stage sem DEBIAN)
          RPMBUILD="$HOME/rpmbuild"
          rm -rf "$RPMBUILD"
          mkdir -p "$RPMBUILD"/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          PAYLOAD="$RUNNER_TEMP/rpm-payload"
          rm -rf "$PAYLOAD"
          mkdir -p "$PAYLOAD"
          cp -r "$STAGE/opt" "$STAGE/usr" "$PAYLOAD/"
          cat > "$RPMBUILD/SPECS/chronos.spec" <<EOF
          Name: chronos
          Version: ${TAG}
          Release: 1
          Summary: Cross-platform Hub for Routed Outgoing Network Open Source
          License: Apache-2.0
          BuildArch: x86_64
          %description
          CHRONOS — central tática de mensagens e agendamentos (Flutter HUD).
          %install
          mkdir -p %{buildroot}/opt %{buildroot}/usr
          cp -r "$PAYLOAD/opt" %{buildroot}/
          cp -r "$PAYLOAD/usr" %{buildroot}/
          %files
          /opt/chronos
          /usr/share/applications/chronos.desktop
          /usr/share/icons/hicolor/scalable/apps/chronos.svg
          /usr/share/icons/hicolor/128x128/apps/chronos.png
          /usr/share/icons/hicolor/512x512/apps/chronos.png
          EOF
          rpmbuild -bb "$RPMBUILD/SPECS/chronos.spec"
          cp "$RPMBUILD/RPMS/x86_64/"*.rpm dist/
          ls -la dist/
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chronos-linux
          path: dist/*

  # ── Windows: .exe + .zip ──────────────────────────────────────────────────
  windows:
    needs: check
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Pub get
        run: flutter pub get
      - name: Build Windows bundle
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          flutter build windows --release --build-name="$tag" --build-number="${{ github.run_number }}"
          Get-ChildItem build/windows/x64/runner/Release
      - name: Zip bundle
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $src = "build/windows/x64/runner/Release"
          $zip = "chronos-$tag-windows-x86_64.zip"
          Compress-Archive -Path "$src/*" -DestinationPath $zip -Force
          Copy-Item "$src/chronos_hub.exe" -Destination "chronos-windows-x86_64.exe"
          Get-ChildItem *.zip, *.exe
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chronos-windows
          path: |
            *.zip
            chronos-windows-x86_64.exe

  # ── Publica tudo na Release do GitHub ──────────────────────────────────────
  publish:
    needs: [android, linux, windows]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: List artifacts
        run: ls -laR dist | head -n 40
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Padrões explícitos: só pacotes finais, nunca arquivos do bundle.
          files: |
            dist/*.apk
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/*.zip
            dist/*.exe
          generate_release_notes: true
