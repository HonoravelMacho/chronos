plugins {
    id 'com.android.application'
}

android {
    namespace 'com.chronos.hub'
    compileSdk 34
    buildToolsVersion '34.0.0'
    // NDK r25: raylib 5.0 usa ALooper_pollAll, removido como erro no NDK r26+.
    ndkVersion '25.2.9519653'

    defaultConfig {
        applicationId 'com.chronos.hub'
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName '0.1.0'

        // ARM64 only: raylib 5.0 (stb_image_resize2 fp16/NEON) não compila
        // para armeabi-v7a; arm64-v8a cobre ~todos os devices atuais.
        ndk { abiFilters 'arm64-v8a' }

        externalNativeBuild {
            cmake {
                // Raylib usa PLATFORM=Android; sem curl/TDLib no mobile.
                arguments '-DPLATFORM=Android',
                          '-DANDROID_STL=c++_shared',
                          '-DCHRONOS_ENABLE_CURL=OFF',
                          '-DCHRONOS_ENABLE_TDLIB=OFF',
                          '-DCHRONOS_ENABLE_SQLCIPHER=OFF',
                          '-DCMAKE_BUILD_TYPE=Release'
                targets 'chronos_native'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path '../../CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
