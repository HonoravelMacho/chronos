<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- CHRONOS — ampulheta (símbolo de tempo). Fundo HUD escuro + neon. -->
  <defs>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD36B"/>
      <stop offset="1" stop-color="#FFB000"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00F0FF" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#9BF6FF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#00F0FF" stop-opacity="0.95"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="24" fill="#07090E"/>
  <rect x="4" y="4" width="120" height="120" rx="24" fill="none" stroke="#3A506E" stroke-width="4"/>
  <!-- grade tática sutil -->
  <g stroke="#00F0FF" stroke-opacity="0.12" stroke-width="1">
    <path d="M20 96 H108 M20 32 H108"/>
  </g>
  <!-- traves da ampulheta -->
  <rect x="30" y="22" width="68" height="8" rx="3" fill="url(#glass)"/>
  <rect x="30" y="98" width="68" height="8" rx="3" fill="url(#glass)"/>
  <rect x="33" y="30" width="6" height="68" rx="3" fill="#00F0FF" opacity="0.85"/>
  <rect x="89" y="30" width="6" height="68" rx="3" fill="#00F0FF" opacity="0.85"/>
  <!-- vidro: dois funis -->
  <path d="M39 32 L89 32 L70 60 L89 96 L39 96 L58 60 Z"
        fill="#0B1220" stroke="url(#glass)" stroke-width="4" stroke-linejoin="round"/>
  <!-- areia em cima (triângulo vazando) -->
  <path d="M48 36 L80 36 L66 58 L62 58 Z" fill="url(#sand)"/>
  <!-- fio de areia -->
  <rect x="62.6" y="58" width="2.8" height="14" fill="#FFB000"/>
  <!-- monte embaixo -->
  <path d="M46 92 L82 92 L70 72 L64 72 L64 70 L60 70 L60 72 L58 72 Z" fill="url(#sand)"/>
  <!-- brilho -->
  <circle cx="28" cy="22" r="3" fill="#00FFAA"/>
  <circle cx="100" cy="22" r="3" fill="#FF3C5A"/>
</svg>
