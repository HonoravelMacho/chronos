# CHRONOS — Evolution API em 1 comando (WhatsApp real).
# Uso:
#   EVO_KEY=minha-chave-forte docker compose -f docker/evolution-compose.yml up -d
#   # app: painel SYNC WHATSAPP -> servidor http://localhost:8080,
#   #        API KEY = a mesma, instância = chronos -> SALVAR + CONECTAR
#   #        -> escaneie o QR no celular (WhatsApp > Aparelhos)
#   docker compose -f docker/evolution-compose.yml down   # parar
services:
  evolution:
    image: evoapicloud/evolution-api:v2.3.1
    container_name: chronos_evolution
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - SERVER_URL=http://localhost:8080
      - AUTHENTICATION_API_KEY=${EVO_KEY:-chronos-dev-key}
    volumes:
      - evolution_instances:/evolution/instances

volumes:
  evolution_instances:
